name: Telegram-knoppen verwerken

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency: state

jobs:
  poll:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/telegram.py poll
      - name: Status bewaren
        run: |
          git config user.name "videobot"
          git config user.email "videobot@users.noreply.github.com"
          git add state
          git diff --cached --quiet || (git commit -qm "Status bijgewerkt" && git push -q)
      - name: Foutmelding naar Telegram
        if: failure()
        run: python scripts/telegram.py send "Verwerken van de Telegram-knoppen mislukt. Bekijk: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
