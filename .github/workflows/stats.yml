name: Cijfers ophalen

on:
  schedule:
    - cron: "17 4,10 * * *"  # vlak voor het brein een video schrijft
  workflow_dispatch:

concurrency: stats

jobs:
  stats:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/stats.py
      - name: Bewaren
        run: |
          git config user.name "videobot"
          git config user.email "videobot@users.noreply.github.com"
          git add state/stats.json
          git diff --cached --quiet || (git commit -qm "Cijfers bijgewerkt" && git pull -q --rebase && git push -q)
