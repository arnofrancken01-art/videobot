name: Render video

on:
  push:
    branches: [main]
    paths: ["episodes/*.json", "long/*.json"]
  workflow_dispatch:
    inputs:
      episode:
        description: "Pad naar het episode-bestand"
        default: "episodes/ep001.json"
      test:
        description: "Alleen testen: niet bewaren en niet naar Telegram sturen"
        type: boolean
        default: false

concurrency: render

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      VOICE_ENGINE: chatterbox
      REQUIRE_EXACT_TIMING: ""  # Chatterbox geeft geen woordtiming: align.py zet die met Whisper
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - name: Welke afleveringen?
        id: ep
        run: |
          # Alle afleveringen uit deze push (de ochtendrun pusht er drie tegelijk), of die van een handmatige start.
          if [ -n "${{ inputs.episode }}" ]; then files="${{ inputs.episode }}"
          else
            before="${{ github.event.before }}"
            git cat-file -e "$before" 2>/dev/null || before=HEAD~1
            files=$(git diff --name-only --diff-filter=AM "$before" HEAD -- 'episodes/*.json' 'long/*.json' | sort | tr '\n' ' ')
          fi
          echo "files=$files" >> "$GITHUB_OUTPUT"
          echo "Te maken: $files"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # Chatterbox werkt (nog) niet op 3.12
          cache: pip
      - name: Modellen cachen
        uses: actions/cache@v4
        with:
          path: models
          key: kokoro-v1.0
      - name: Node-pakketten
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip  # geen GPU-download nodig (faalde soms met 504)
        run: npm ci || (sleep 20 && npm ci)
      - name: Python-pakketten
        run: |
          # Stem: Chatterbox (expressief, gekozen door Arno op 2026-11-25). Kokoro-onnx blijft als terugval.
          pip install torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install numpy setuptools wheel cython
          pip install --no-build-isolation pkuseg==0.0.25 || pip install pkuseg
          pip install -r requirements.txt chatterbox-tts faster-whisper==1.1.1 requests
      - name: Stemmodel cachen
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-chatterbox-v1
      - name: Kokoro-model downloaden
        run: test -f models/kokoro-v1.0.onnx || npm run models
      - name: Video's maken en naar Telegram sturen
        env:
          NO_SEND: ${{ inputs.test && '1' || '' }}
        run: |
          git config user.name "videobot"
          git config user.email "videobot@users.noreply.github.com"
          failed=""
          for f in ${{ steps.ep.outputs.files }}; do
            bash scripts/render_one.sh "$f" || { failed="$failed $(basename "$f" .json)"; git checkout -q -f "$GITHUB_SHA" || true; }
          done
          if [ -n "$failed" ]; then echo "FAILED=$failed" >> "$GITHUB_ENV"; exit 1; fi
      - name: Foutmelding naar Telegram
        if: failure()
        run: |
          pip install requests >/dev/null 2>&1 || true
          python scripts/telegram.py send "Render mislukt voor: ${{ env.FAILED || steps.ep.outputs.files }}. Bekijk: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
