name: Clipbot GTA 6 (dagelijkse top 5)

on:
  schedule:
    - cron: "10 8 * * *"   # 09:10 Brussel: na de Amerikaanse avondstreams
  workflow_dispatch:
    inputs:
      test:
        description: "Testrun: negeert de toestemmingslijst, wordt nooit gepost"
        type: boolean
        default: false
      game:
        description: "Ander spel (leeg = GTA 6), bv. Grand Theft Auto V"
        default: ""
      channels:
        description: "Kanalen (komma's) als er nog geen Twitch-sleutel is"
        default: ""
  push:
    paths: ["clipbot/TEST.txt"]  # dit bestand aanpassen = testrun met de instellingen erin

concurrency: clipbot

jobs:
  clips:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    permissions:
      contents: write
    env:
      CLIPBOT_TELEGRAM_TOKEN: ${{ secrets.CLIPBOT_TELEGRAM_TOKEN }}
      TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
      TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Instellingen van deze run
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            test=true; game=$(sed -n 's/^game=//p' clipbot/TEST.txt); channels=$(sed -n 's/^channels=//p' clipbot/TEST.txt)
          else
            test="${{ inputs.test || 'false' }}"; game="${{ inputs.game }}"; channels="${{ inputs.channels }}"
          fi
          args=""; [ "$test" = "true" ] && args="--test"
          echo "test=$test" >> "$GITHUB_OUTPUT"
          echo "game=$game" >> "$GITHUB_OUTPUT"
          echo "channels=$channels" >> "$GITHUB_OUTPUT"
          echo "args=$args" >> "$GITHUB_OUTPUT"
          echo "key=c$(date -u +%Y%m%d)-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests numpy soundfile kokoro-onnx==0.6.1 faster-whisper==1.1.1 yt-dlp
      - name: Clips zoeken
        id: find
        run: |
          set +e
          python clipbot/scripts/find.py ${{ steps.mode.outputs.args }} ${{ steps.mode.outputs.game && format('--game "{0}"', steps.mode.outputs.game) || '' }} --channels "${{ steps.mode.outputs.channels }}"
          code=$?
          if [ $code = 3 ]; then echo "none=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          exit $code
      - name: Te weinig clips
        if: steps.find.outputs.none == 'true'
        run: |
          python - <<'PY'
          import sys, json; sys.path.insert(0, "clipbot/scripts")
          from common import send, load, WORK
          others = load(WORK / "others.json", [])
          tips = "\n".join(f"• {o['streamer']}: {o['views']} views ({o['clips']} clips) {o['best']}" for o in others[:8])
          send("Clipbot: vandaag te weinig clips van streamers met toestemming, dus geen video." + (f"\n\n<b>Populair zonder toestemming (vraag het ze?):</b>\n{tips}" if tips else ""))
          PY
      - uses: actions/setup-node@v4
        if: steps.find.outputs.none != 'true'
        with:
          node-version: 22
          cache: npm
      - name: Modellen cachen
        if: steps.find.outputs.none != 'true'
        uses: actions/cache@v4
        with:
          path: |
            models
            ~/.cache/huggingface
          key: clipbot-kokoro-v1.0-whisper-small
      - name: Pakketten en modellen
        if: steps.find.outputs.none != 'true'
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        run: |
          npm ci || (sleep 20 && npm ci)
          test -f models/kokoro-v1.0.onnx || npm run models
      - name: Clips downloaden, knippen, ondertitelen en stem maken
        if: steps.find.outputs.none != 'true'
        run: python clipbot/scripts/prepare.py
      - name: Video renderen
        if: steps.find.outputs.none != 'true'
        run: npx remotion render clipbot/remotion/index.ts Clips out/clips.mp4 --public-dir=clipbot/public --concurrency=2 --crf=23
      - name: Video bewaren op de clip-renders-branch
        if: steps.find.outputs.none != 'true'
        run: |
          key="${{ steps.mode.outputs.key }}"
          git config user.name "clipbot"; git config user.email "clipbot@users.noreply.github.com"
          cp out/clips.mp4 /tmp/$key.mp4; cp clipbot/work/meta.json /tmp/$key.json
          git stash -u -q || true
          git fetch origin clip-renders:refs/remotes/origin/clip-renders || true
          git checkout -q -f -B clip-renders origin/clip-renders || (git checkout -q -f --orphan clip-renders && git rm -rfq --cached . >/dev/null)
          git clean -fdq -e out -e clipbot/work -e node_modules -e models
          mkdir -p clips && cp /tmp/$key.mp4 /tmp/$key.json clips/
          git add clips && git commit -qm "Clipvideo $key" && git push -q origin clip-renders
          git checkout -q -f ${{ github.ref_name }}
      - name: Naar Telegram
        if: steps.find.outputs.none != 'true'
        run: |
          python - <<'PY'
          import json, sys; sys.path.insert(0, "clipbot/scripts")
          from common import send, send_video, load, WORK
          key, test = "${{ steps.mode.outputs.key }}", "${{ steps.mode.outputs.test }}" == "true"
          meta = load(WORK / "meta.json")
          cap = (f"<b>{'TEST (niet posten)' if test else 'Nieuwe clipvideo'}:</b> {meta['title']}\n\n{meta['credits']}")
          send_video("out/clips.mp4", cap, None if test else key)
          others = load(WORK / "others.json", [])
          if others:
              send("<b>Populaire streamers zonder toestemming</b> (vraag of je mag clippen, dan komen ze in clipbot/config/streamers.json):\n" +
                   "\n".join(f"• {o['streamer']}: {o['views']} views ({o['clips']} clips) {o['best']}" for o in others[:8]))
          PY
      - name: Gebruikte clips onthouden
        if: steps.find.outputs.none != 'true' && steps.mode.outputs.test != 'true'
        run: |
          python - <<'PY'
          import sys, time; sys.path.insert(0, "clipbot/scripts")
          from common import load, save, WORK, STATE
          used = load(STATE / "used.json", {})
          for c in load(WORK / "meta.json")["clips"]:
              used[c["id"]] = time.strftime("%Y-%m-%d")
          save(STATE / "used.json", used)
          PY
          git add clipbot/state && git commit -qm "Clipbot: clips gebruikt" && git pull -q --rebase && git push -q
      - name: Wachten op Posten/Weg
        if: steps.find.outputs.none != 'true' && steps.mode.outputs.test != 'true' && env.CLIPBOT_TELEGRAM_TOKEN != ''
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          CLIPBOT_YOUTUBE_REFRESH_TOKEN: ${{ secrets.CLIPBOT_YOUTUBE_REFRESH_TOKEN }}
        run: |
          mins=$(python -c "import json;print(json.load(open('clipbot/config/settings.json'))['approval_wait_minutes'])")
          python clipbot/scripts/approve.py wait "${{ steps.mode.outputs.key }}" "$mins"
          git add clipbot/state && (git diff --cached --quiet || (git commit -qm "Clipbot: status" && git pull -q --rebase && git push -q))
      - name: Foutmelding naar Telegram
        if: failure()
        run: |
          python -c "import sys; sys.path.insert(0,'clipbot/scripts'); from common import send; send('Clipbot-run mislukt: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}')" || true
